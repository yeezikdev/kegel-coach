<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>Kegel Coach</title>
<meta name="description" content="Allena i muscoli pelvici con programmi guidati, punteggi, streak giornaliera e trofei.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232dd4bf'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%230a1020'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/home" aria-label="Kegel Coach">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--acc)"/><circle cx="16" cy="16" r="7" fill="var(--bg)"/></svg>
    <span>Kegel Coach</span>
  </a>
  <div class="top-r">
    <span id="streakChip" class="chip">🔥 0</span>
    <a id="userDot" class="chip" href="#/profile">Ospite</a>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Navigazione">
  <a href="#/home" data-tab="home"><i>🏠</i><span>Oggi</span></a>
  <a href="#/exercises" data-tab="exercises"><i>💪</i><span>Esercizi</span></a>
  <a href="#/progress" data-tab="progress"><i>📈</i><span>Progressi</span></a>
  <a href="#/trophies" data-tab="trophies"><i>🏆</i><span>Trofei</span></a>
  <a href="#/profile" data-tab="profile"><i>⚙️</i><span>Profilo</span></a>
</nav>

<div id="toasts" aria-live="polite"></div>
<div id="modal"></div>
<div id="runner"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
